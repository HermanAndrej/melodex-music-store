<!-- Register Page Content -->

    <!-- Registration Form -->
    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <h2 class="text-center mb-4">Create an Account</h2>
                <div id="register-alert" class="alert d-none" role="alert"></div>
                <form id="register-form" novalidate>
                    <div class="mb-3">
                        <label for="register-name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="register-name" required
                               placeholder="Enter your full name">
                        <div class="invalid-feedback">
                            Please provide your full name.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="register-email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="register-email" required
                               placeholder="Enter email">
                        <div class="invalid-feedback">
                            Please provide a valid email address.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="register-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="register-password" required
                               placeholder="Password" minlength="6">
                        <div class="invalid-feedback">
                            Password must be at least 6 characters.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="register-confirm-password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="register-confirm-password" required
                               placeholder="Confirm Password">
                        <div class="invalid-feedback">
                            Passwords do not match.
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms-agreement" required>
                        <label class="form-check-label" for="terms-agreement">I agree to the <a href="#">Terms and Conditions</a></label>
                        <div class="invalid-feedback">
                            You must agree to the terms and conditions.
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100" id="register-button">Register</button>
                    <p class="mt-3 text-center">
                        Already have an account? <a href="#/login">Login here</a>
                    </p>
                </form>
            </div>
        </div>
    </section>
    <!-- End Registration Form -->

    <!-- Registration JavaScript -->
    <script type="module">
        import authService from '../js/services/authService.js';

        document.addEventListener('DOMContentLoaded', () => {
            const registerForm = document.getElementById('register-form');
            const registerAlert = document.getElementById('register-alert');
            const passwordInput = document.getElementById('register-password');
            const confirmPasswordInput = document.getElementById('register-confirm-password');
            
            // Custom password match validation
            confirmPasswordInput.addEventListener('input', () => {
                if (passwordInput.value !== confirmPasswordInput.value) {
                    confirmPasswordInput.setCustomValidity('Passwords do not match');
                } else {
                    confirmPasswordInput.setCustomValidity('');
                }
            });
            
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Reset alert
                registerAlert.classList.add('d-none');
                
                // Get form inputs
                const nameInput = document.getElementById('register-name');
                const emailInput = document.getElementById('register-email');
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                // Form validation
                registerForm.classList.add('was-validated');
                
                // Custom password match validation
                if (password !== confirmPassword) {
                    confirmPasswordInput.setCustomValidity('Passwords do not match');
                    confirmPasswordInput.reportValidity();
                    return;
                } else {
                    confirmPasswordInput.setCustomValidity('');
                }
                
                if (!registerForm.checkValidity()) {
                    return;
                }
                
                // Disable button during registration
                const registerButton = document.getElementById('register-button');
                registerButton.disabled = true;
                registerButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Creating account...';
                
                try {
                    // Disable button during registration
                    const registerButton = document.getElementById('register-button');
                    registerButton.disabled = true;
                    registerButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Registering...';
                    
                    try {
                        // Prepare user data
                        const userData = {
                            name: nameInput.value.trim(),
                            email: emailInput.value.trim(),
                            password: password
                        };
                        
                        // Call the auth service to register the user
                        const result = await authService.register(userData);
                        
                        if (result.success) {
                            // Show success message
                            registerAlert.textContent = result.message || 'Registration successful! You are now logged in.';
                            registerAlert.classList.remove('alert-danger');
                            registerAlert.classList.add('alert-success');
                            registerAlert.classList.remove('d-none');
                            
                            // Redirect to home page after a short delay
                            setTimeout(() => {
                                window.location.hash = '#/';
                            }, 1500);
                        } else {
                            // Show error message
                            throw new Error(result.error || 'Registration failed. Please try again.');
                        }
                    } catch (error) {
                        console.error('Registration error:', error);
                        registerAlert.textContent = error.message || 'Registration failed. Please try again.';
                        registerAlert.classList.remove('alert-success');
                        registerAlert.classList.add('alert-danger');
                        registerAlert.classList.remove('d-none');
                        
                        // Re-enable the register button
                        const registerButton = document.getElementById('register-button');
                        // Re-enable button
                        registerButton.disabled = false;
                        registerButton.textContent = 'Register';
                    }
                } catch (error) {
                    console.error('Registration error:', error);
                    registerAlert.textContent = 'An error occurred. Please try again.';
                    registerAlert.classList.add('alert-danger');
                    registerAlert.classList.remove('d-none', 'alert-success');
                    
                    // Re-enable button
                    registerButton.disabled = false;
                    registerButton.textContent = 'Register';
                }
            });
        });
    </script>
    <!-- End Registration JavaScript -->

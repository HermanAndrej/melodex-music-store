<!-- Login Page Content -->

    <!-- Login Form -->
    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <h2 class="text-center mb-4">Login</h2>
                <div id="login-alert" class="alert alert-danger d-none" role="alert">
                    Invalid email or password. Please try again.
                </div>
                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label for="login-email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="login-email" required 
                               aria-describedby="emailHelp" placeholder="Enter email">
                        <div class="invalid-feedback">
                            Please provide a valid email address.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="login-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="login-password" required
                               placeholder="Password" minlength="6">
                        <div class="invalid-feedback">
                            Password must be at least 6 characters.
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember-me">
                        <label class="form-check-label" for="remember-me">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-success w-100" id="login-button">Login</button>
                    <p class="mt-3 text-center">
                        Don't have an account? <a href="#/register">Register here</a>
                    </p>
                </form>
            </div>
        </div>
    </section>
    <!-- End Login Form -->

    <!-- Login JavaScript -->
    <script type="module">
        import authService from '../js/services/authService.js';

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const loginAlert = document.getElementById('login-alert');
            
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Reset alert
                loginAlert.classList.add('d-none');
                
                // Get form inputs
                const emailInput = document.getElementById('login-email');
                const passwordInput = document.getElementById('login-password');
                
                // Form validation
                loginForm.classList.add('was-validated');
                
                if (!loginForm.checkValidity()) {
                    return;
                }
                
                // Disable button during login
                const loginButton = document.getElementById('login-button');
                loginButton.disabled = true;
                loginButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging in...';
                
                try {
                    // Attempt login
                    const result = await authService.login(emailInput.value, passwordInput.value);
                    
                    if (result.success) {
                        // Successful login
                        loginAlert.textContent = result.message || 'Login successful!';
                        loginAlert.classList.remove('alert-danger');
                        loginAlert.classList.add('alert-success');
                        loginAlert.classList.remove('d-none');
                        
                        // Redirect to home page after a short delay
                        setTimeout(() => {
                            window.location.hash = '/';
                        }, 1000);
                    } else {
                        // Failed login
                        throw new Error(result.error || 'Invalid email or password');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    loginAlert.textContent = error.message || 'An error occurred. Please try again.';
                    loginAlert.classList.remove('alert-success');
                    loginAlert.classList.add('alert-danger');
                    loginAlert.classList.remove('d-none');
                    
                    // Re-enable button
                    loginButton.disabled = false;
                    loginButton.textContent = 'Login';
                }
            });
        });
    </script>
    <!-- End Login JavaScript -->

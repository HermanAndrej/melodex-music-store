<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Melodex Music Store</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <!-- Admin Header -->
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">
                <i class="bi bi-speedometer2 me-2"></i>Admin Dashboard
            </h1>
            <div>
                <button id="logoutBtn" class="btn btn-outline-danger">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </div>
        </header>

        <!-- Admin Navigation -->
        <nav class="admin-nav mb-4">
            <button class="btn btn-primary" id="dashboardBtn">
                <i class="bi bi-speedometer2 me-2"></i>Dashboard
            </button>
            <button class="btn btn-outline-primary" id="manageUsers">
                <i class="bi bi-people me-2"></i>Manage Users
            </button>
            <button class="btn btn-outline-primary" id="viewAnalytics">
                <i class="bi bi-graph-up me-2"></i>Analytics
            </button>
            <button class="btn btn-outline-primary" id="systemSettings">
                <i class="bi bi-gear me-2"></i>Settings
            </button>
        </nav>

        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="stat-value" id="userCount">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3>Active Today</h3>
                    <div class="stat-value" id="activeUsers">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3>Orders</h3>
                    <div class="stat-value" id="orderCount">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3>Revenue</h3>
                    <div class="stat-value" id="revenue">$0</div>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="card">
            <div class="card-body" id="adminContent">
                <!-- Content will be loaded here dynamically -->
                <div class="text-center py-5">
                    <i class="bi bi-speedometer2" style="font-size: 3rem; opacity: 0.2;"></i>
                    <p class="text-muted mt-3">Select an option from the menu to get started</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { AuthService } from '/js/services/authService.js';
        import { AdminPanel } from '/js/components/AdminPanel.js';

        // Initialize services
        const authService = new AuthService();
        
        // Check authentication status
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Check if user is authenticated
                const isAuthenticated = await authService.checkAuth();
                
                if (!isAuthenticated) {
                    window.location.href = '/login.html';
                    return;
                }
                
                // Check if user is admin
                const user = authService.getCurrentUser();
                if (!user || !user.roles || !user.roles.includes('admin')) {
                    window.location.href = '/index.html';
                    return;
                }
                
                // Initialize admin panel
                const adminPanel = new AdminPanel(authService);
                
                // Logout handler
                document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                    await authService.logout();
                    window.location.href = '/login.html';
                });
                
                // Dashboard button handler
                document.getElementById('dashboardBtn')?.addEventListener('click', () => {
                    // Load dashboard content
                    document.getElementById('adminContent').innerHTML = `
                        <div class="p-4">
                            <h2 class="h4 mb-4">Dashboard Overview</h2>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="card mb-4">
                                        <div class="card-header">
                                            <h3 class="h5 mb-0">Recent Activity</h3>
                                        </div>
                                        <div class="card-body">
                                            <div class="list-group list-group-flush">
                                                <div class="list-group-item">
                                                    <div class="d-flex w-100 justify-content-between">
                                                        <h5 class="mb-1">New user registered</h5>
                                                        <small>2 minutes ago</small>
                                                    </div>
                                                    <p class="mb-1">John Doe (john@example.com) has registered.</p>
                                                </div>
                                                <div class="list-group-item">
                                                    <div class="d-flex w-100 justify-content-between">
                                                        <h5 class="mb-1">New order received</h5>
                                                        <small>15 minutes ago</small>
                                                    </div>
                                                    <p class="mb-1">Order #1234 for $99.99 has been placed.</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-header">
                                            <h3 class="h5 mb-0">Quick Stats</h3>
                                        </div>
                                        <div class="card-body">
                                            <div class="list-group list-group-flush">
                                                <div class="list-group-item d-flex justify-content-between align-items-center">
                                                    <span>Total Users</span>
                                                    <span class="badge bg-primary rounded-pill" id="totalUsers">0</span>
                                                </div>
                                                <div class="list-group-item d-flex justify-content-between align-items-center">
                                                    <span>Active Today</span>
                                                    <span class="badge bg-success rounded-pill" id="activeToday">0</span>
                                                </div>
                                                <div class="list-group-item d-flex justify-content-between align-items-center">
                                                    <span>Total Orders</span>
                                                    <span class="badge bg-info rounded-pill" id="totalOrders">0</span>
                                                </div>
                                                <div class="list-group-item d-flex justify-content-between align-items-center">
                                                    <span>Revenue (30 days)</span>
                                                    <span class="badge bg-warning text-dark rounded-pill" id="monthlyRevenue">$0</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                // Trigger dashboard load by default
                document.getElementById('dashboardBtn')?.click();
                
            } catch (error) {
                console.error('Admin panel initialization error:', error);
                window.location.href = '/login.html';
            }
        });
    </script>
    <!-- Toast Notifications -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                <!-- Message will be inserted here -->
            </div>
        </div>
    </div>
</body>
</html>
